
<!DOCTYPE html>
<html>
<head>
    <title>Nested Table</title>
</head>
<body>

<table border="1" cellpadding="10">
    <tr>
    <th>Name</th>
    <th>Details</th>
    </tr>
    <tr>
        <td>Shashikala</td>
        <td>
            <table border="2">
                <th>Subject</th>
                <th>Marks</th>
                <tr>
                    <td>Python</td>
                    <td>90</td>
                </tr>
                <tr>
                    <td>SQL</td>
                    <td>85</td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
